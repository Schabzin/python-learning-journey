<!DOCTYPE html>
<html>
<head>
    <title>Textbook Search</title>
</head>
<body>
    <h1>Search Textbooks</h1>
    <form method="GET" action="/search">
        <input type="text" name="q" value="{{ query }}" placeholder="Search by title...">
        <button type="submit">Search</button>
    </form>

    <ul>
        {% for book in results %}
            <li>{{ book.title }} - {{ book.publisher }} - R{{ book.price }}</li>
        {% endfor %}
    </ul>
</body>
</html>
