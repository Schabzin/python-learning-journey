<!DOCTYPE html>
<html>
<head>
    <title>About Kalikeng</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="/">Home</a> |
        <a href="/about">About</a> |
        <a href="/clients">Clients</a>
    </nav>
    <form method="POST" action="/search">
        <input type="text" name="client_name" placeholder="Enter client name">
        <button type="submit">Search</button>
        <a href/"/">Home</a>
        {% if result %}
            <p>Name: {{ result.name }}</p>
            <p>Amount: R{{ result.amount }}</p>
            <p>Status: {{ result.status }}</p>
        {% else %}
            <p>Client not found</p>
        {% endif %}
    </form>
    <footer>
        <p>&copy; 2026 <span>Kalikeng Trading and Projects CC</span> - All rights reserved</p>
        <p>Reg No: 2010/007041/23 | VAT No: 4340257320</p>
    </footer>
</body>
</html>
