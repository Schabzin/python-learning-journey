<!DOCTYPE html>
<html>
<head>
    <title>Clients</title>
</head>
<body>
    <h1>Kalikeng Clients</h1>
    <table border="1">
       <tr><th>Name</th><th>Amount</th><th>Status</th></tr> 
        {% for client in clients %}
            <tr>
                <td>{{ client[0] }}</td>
                <td>{{ client[1] }}</td>
                <td>{{ client[2] }}</td>
            </tr>
        {% endfor %}
    </table>
</body>
