<!DOCTYPE html>
<html>
<head>
    <style>
        body {
    font-family: Arial;
    background: #1B3A5C;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
}
.login-box {
    background: white;
    padding: 40px;
    border-radius: 8px;
    width: 350px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}
.login-box h1 {
    color: #1B3A5C;
    text-align: center;
    margin-bottom: 5px;
}
.login-box p {
    color: #C85A00;
    text-align: center;
    margin-bottom: 25px;
    font-size: 13px;
}
input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-sizing: border-box;
    font-size: 14px;
}
button {
    width: 100%;
    padding: 12px;
    background: #C85A00;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 10px;
}
button:hover { background: #1B3A5C; }
.flash-error { background: #ffe0e0; color: #cc0000; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
.flash-success { background: #e0ffe0; color: #006600; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
.error-msg { color: red; font-size: 12px; margin-top: 5px; }
    </style>

 
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    <form method="POST" action="/login" id="login-form">
        <input type="text" name="username" id="username" placeholder="Username">
        <input type="password" name="password" id="password" placeholder="Password">
        <button type="submit" id="login-btn">Login</button>
        <p id="error-msg" class="error-msg"></p>
        
    </form>
        <script>
            window.onload = () => {
                const btn = document.getElementById("login-btn");
                btn.textContent = "Login";
                btn.disabled = false;
            };
            setTimeout(() => {
                const flash = document.querySelector(".flash-success");
                if (flash) flash.textContent = "";
            }, 3000);
            function showError(message) {
                document.getElementById("error-msg").textContent = message;
        };
        document.getElementById("login-form").addEventListener("submit", (e) => {
                const username = document.getElementById("username").value.trim();
                const password = document.getElementById("password").value.trim();
                if (!username) {
                    e.preventDefault();
                    showError("Username is required");
                    return;
                }
                if (password.length < 6) {
                    e.preventDefault();
                    showError("Password must be at least 6 characters")
                    return;
                }
                const btn = document.getElementById("login-btn");
                btn.textContent = "Logging in...";
                btn.disabled = true;
            });
           
            

        </script>
</body>
</html>
