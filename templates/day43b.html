<!DOCTYPE html>
<html>
<body>
    <input type="number" id="number-input" placeholder="Enter ID">
    <button type="button">Click</button>
    <p id="loading"></p>
    <p id="post-result"></p>
    <p id="user-result"></p>
    <p id="error"></p>
    
    <script>
        async function fetchPost(id) {
            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/posts/${id}`);

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`); 
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.log("Error:", error.message);
                document.getElementById("error").textContent = error;
                return [];
            } finally {
                document.getElementById("loading").textContent = "";
            }
        }

        async function fetchUser(id) {
            try {
                const response = await fetch(`https://jsonplaceholder.typicode.com/users/${id}`);

                if (!response.ok) {
                    throw new Error(`Server error: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.log("Error:", error.message);
                document.getElementById("error").textContent = error;
                return [];
            }
        };

        document.querySelector("button").addEventListener("click", async () => {
            const id = document.getElementById("number-input").value;
            const post = await fetchPost(id);
            const user = await fetchUser(id);
            if (post.title) document.getElementById("post-result").textContent = post.title;
            if (user.name) document.getElementById("user-result").textContent = user.name;
        })
    </script>
</body>
</html>
