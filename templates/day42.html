v <!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial; background: #f5f5f5; margin: 0; padding: 20px}
        h1 {color: #1B3A5C}
    </style>
</head>
<body>
    <h1>Kalikeng REST API</h1>
    <form id="client-form">
        <input type="text" id="name-input" placeholder="Client name" required>
        <input type="number" id="amount-input" placeholder="Amount" required>
        <select id="status-input">
            <option value="Paid">Paid</option>
            <option value="Unpaid">Unpaid</option>
        </select>
        <button type="submit">Add Client</button>
    </form>
    <p>Paid: <span id="paid">0</span></p>
    <p>Unpaid: <span id="unpaid">0</span></p>
    <ul id="client-list"></ul>
    <p id="total">Total: R 0.00</p>

    <div id="message"></div>

        <script>
            let clients = [];
            
            function renderClients() {
                const list = document.getElementById("client-list");
                list.innerHTML = "";
                clients.forEach(client => {
                    const li = document.createElement("li");
                    li.innerHTML = `<span>${client.name} - R${client.amount} - ${client.status}</span><button onclick="deleteClient(${client.id})">Delete</button>`;
                    list.appendChild(li);
                });
            };
            async function loadClients() {
                document.getElementById("message").textContent = "Loading...";
                const response = await fetch("/api/clients");
                clients = await response.json();
                document.getElementById("message").textContent = "";
                renderClients();
                updateSummary();
            };
            async function addClient(name, amount, status) {
                document.getElementById("message").textContent = "Client added successfully";
                const response = await fetch("/api/clients", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, amount, status})
                });
                if (response.ok) {
                    const data = await response.json();
                    console.log("Success:", data.message);
                } else {
                    const error = await response.json();
                    console.log("Error:", error.error)
                }
            };
            async function deleteClient(id) {
                const response = await fetch(`/api/clients/${id}`, {
                    method: "DELETE"
                });
                if (response.ok) {
                    showMessage("Client deleted", "success");
                    await loadClients();
                } else {
                    const error = await response.json();
                    showMessage(error.error, "error");
                }
                function updateSummary(clients) {
                    const total = clients.reduce((sum, c) => sum + c.amount, 0);
                    document.getElementById("total").textContent = `Total: R${total.toFixed(2)}`;
                    document.getElementById("paid").textContent = clients.filter(c => c.status === "Paid").length;
                    document.getElementById("unpaid").textContent = clients.filter(c => c.status === "Unpaid").length;
                };
                function showMessage(message, type) {
                    const el = document.getElementById("message");
                    el.textContent = message;
                    el.style.color = type ==="success" ? "green" : "red";
                    setTimeout(() => { el.textContent = ""; }, 3000);
                }
            
            };
            document.getElementById("client-form").addEventListener("submit", async (e) => {
                e.preventDefault();
                const name = document.getElementById("name-input").value.trim();
                const amount = parseFloat(document.getElementById("amount-input").value);
                const status = document.getElementById("status-input").value;
                await addClient(name, amount, status);
                await loadClients();
            });
            loadClients();
        </script>
</body>
</html>
