<!DOCTYPE html>
<html>
<head>
    <title>Separaka - Manage Marshalls</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

    <div id="loading-screen">
        <div class="loading-glow"></div>
        <div class="loading-content">
            <div class="loading-bars">
                <div class="bar bar-1"></div>
                <div class="bar bar-2"></div>
                <div class="bar bar-3"></div>
            </div>
            <div class="loading-text">
                <div class="loading-wordmark">SEPARAKA</div>
                <div class="loading-tagline">Taxi Management</div>
            </div>
        </div>
    </div>

    <style>
        #loading-screen { position: fixed; inset: 0; background: #1B3A5C; display: flex; align-items: center; justify-content: center; z-index: 9999; overflow: hidden; transition: opacity 0.4s ease; }
        .loading-glow { position: absolute; top: 50%; left: 50%; width: 480px; height: 480px; background: radial-gradient(circle, rgba(200,90,0,0.22) 0%, rgba(200,90,0,0) 68%); animation: driftGlow 4s ease-in-out infinite; pointer-events: none; }
        .loading-content { display: flex; flex-direction: column; align-items: center; gap: 40px; }
        .loading-bars { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 220px; }
        .bar { width: 100%; height: 16px; border-radius: 8px; transform-origin: center; animation: pulseBar 1.05s ease-in-out infinite; }
        .bar-1 { background: #FFFFFF; animation-delay: 0s; }
        .bar-2 { background: #C85A00; animation-delay: 0.15s; }
        .bar-3 { background: #FFFFFF; animation-delay: 0.3s; }
        .loading-text { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .loading-wordmark { font-family: system-ui, sans-serif; font-weight: 800; font-size: 26px; letter-spacing: 4px; color: #FFFFFF; }
        .loading-tagline { font-family: system-ui, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 3px; color: #C85A00; text-transform: uppercase; }
        @keyframes pulseBar { 0%, 100% { transform: scaleX(0.55); opacity: 0.55; } 50% { transform: scaleX(1); opacity: 1; } }
        @keyframes driftGlow { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-50%, -50%) scale(1.15); } }
    </style>

    <script>
        window.addEventListener('load', function () {
            const screen = document.getElementById('loading-screen');
            screen.style.opacity = '0';
            setTimeout(function () { screen.style.display = 'none'; }, 400);
        });
    </script>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/admin/marshalls/add" method="POST">
        <input type="text" name="marshall" placeholder="Marshall name">
        <input type="password" name="password" placeholder="Password">
        <select name="platform_id">
            <option value="">Select Platform</option>
            {% for platform in platforms %}
                <option value="{{ platform.id }}">{{ platform.name }} - {{ platform.rank_name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Submit</button>
    </form>
    <a href="/dashboard">Dashboard</a>
    <ul>
        {% for marshall in marshalls %}
            <li>
                {{ marshall.username }}
            </li>
        {% endfor %}
    </ul>
    
</body>
</html>
