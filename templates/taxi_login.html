<!DOCTYPE html>
<html>
<head>
    <title>Separaka Taxi Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial; background: #1B3A5C; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px; border-radius: 8px; width: 350px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h1 { color: #1B3A5C; text-align: center; margin-bottom: 5px; }
        p { color: #C85A00; text-align: center; margin-bottom: 25px; font-size: 13px; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #C85A00; color: white; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; margin-top: 10px; }
        button:hover { background: #1B3A5C; }
        .flash-error { background: #ffe0e0; color: #cc0000; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
        .flash-success { background: #e0ffe0; color: #006600; padding: 10px; border-radius: 4px; margin-bottom: 10px; }
    </style>
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#1B3A5C">
    <link rel="apple-touch-icon" href="/static/icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Separaka">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="login-box">
        <h1>SEPARAKA</h1>
        <p>Taxi Management System</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Username" required>
            <div style="position: relative; width: 100%; box-sizing: border-box;">
                <input type="password" name="password" id="password-field" placeholder="Password" required style="width: 100%; box-sizing: border-box; padding-right: 40px;">
                <button type="button" id="toggle-password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%);background: none; border: none; cursor: pointer; padding: 0;">👁️</button>
            </div>
            <button type="submit">Login</button>
            <p>Don't have an account? <a href="/register">Register here</a></p>
            <button id="install-btn" style="display:none;">Install Separaka App</button>
            <p id="install-instructions" style="display:none;"></p>
            <a href="{{ url_for('auth.forgot_password') }}" style="color: #C85A00">Forgot Password</a>

        </form>
    </div>
    <script>
        let deferredPrompt;

        window.addEventListener("beforeinstallprompt", function (event) {
            event.preventDefault();
            deferredPrompt = event;
            document.querySelector("#install-btn").style.display = "block";
        });

        document.querySelector("#install-btn").addEventListener("click", async function () {
            if (!deferredPrompt) return;

            deferredPrompt.prompt();
            const choice = await deferredPrompt.userChoice;

            if (choice.outcome === "accepted") {
                console.log("User installed the app");
            } else {
                console.log("User dismissed the install prompt");
            }

            deferredPrompt = null;
            document.querySelector("#install-btn").style.display = "none";
        });

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

        if (isIOS) {
            document.querySelector("#install-instructions").textContent =
                "On iPhone: tap the Share icon, then 'Add to Home Screen'";
            document.querySelector("#install-instructions").style.display = "block";
        }

        self.addEventListener("fetch", function (event) {
            event.respondWith(fetch(event.request));
        });

        document.querySelector("#toggle-password").addEventListener("click", function () {
            const field = document.querySelector("#password-field");
            if (field.type === "password") {
                field.type = "text";
                this.textContent = "🙈";
            } else {
                field.type = "password";
                this.textContent = "👁️";
            }
        });
    </script>
</body>
</html>
