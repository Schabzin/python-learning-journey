<!DOCTYPE html>
<html>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form action="/admin/taxi/add" method="POST">
        <input type="text" name="driver_name" placeholder="Driver name">
        <input type="text" name="driver_username" placeholder="Driver username">
        <input type="password" name="password" placeholder="Password">
        <input type="text" name="plate" placeholder="Plate">
        <select name="platform_id">
            <option value="">Select Platform</option>
            {% for platform in platforms %}
                <option value="{{ platform.id }}">{{ platform.name }}</option>
            {% endfor %}
        </select>
        <button type="submit">Submit</button>
    </form>
    <ul>
        {% for taxi in taxis %}
            <li>{{ taxi.plate }} - {{ taxi.driver_name }} ({{ taxi.driver_username }})</li>
        {% endfor %}
    </ul>
</body>
</html>
