
<div id="loading-screen">
    <div class="loading-content">
        <div class="loading-bars">
            <div class="bar bar-1"></div>
            <div class="bar bar-2"></div>
            <div class="bar bar-3"></div>
        </div>
        <div class="loading-text">
            <div class="loading-wordmark">SEPARAKA</div>
            <div class="loading-tagline">Taxi Management</div>
        </div>
    </div>
</div>

<style>
    #loading-screen { position: fixed; inset: 0; background: #1B3A5C; display: flex; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.4s ease; }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    .loading-content { display: flex; flex-direction: column; align-items: center; gap: 36px; }
    .loading-bars { display: flex; flex-direction: column; gap: 14px; width: 150px; }
    .bar { height: 20px; border-radius: 10px; background: #E8E1D6; transform: scaleX(0); transform-origin: left center; animation: drawBar 0.55s cubic-bezier(.6,0,.2,1) forwards; }
    .bar-1 { animation-delay: 0.10s; }
    .bar-2 { background: #C85A00; animation-delay: 0.35s; }
    .bar-3 { animation-delay: 0.60s; }
    .loading-text { text-align: center; opacity: 0; animation: fadeIn 0.4s ease 1.0s forwards; }
    .loading-wordmark { font-family: system-ui, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: 4px; color: #FFFFFF; }
    .loading-tagline { font-family: system-ui, sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 3px; color: #C85A00; text-transform: uppercase; margin-top: 8px; }
    @keyframes drawBar { to { transform: scaleX(1); } }
    @keyframes fadeIn { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
        .bar, .loading-text { animation: none; transform: none; opacity: 1; }
    }
</style>

<script>
    (function () {
        var screen = document.getElementById("loading-screen");
        var seen = false;
        try { seen = sessionStorage.getItem("separaka_splash_seen") === "1"; } catch (e) {}

        if (seen) {                  
            screen.remove();
            return;
        }
        try { sessionStorage.setItem("separaka_splash_seen", "1"); } catch (e) {}

        var MIN_MS = 1400;             
        var MAX_MS = 5000;             
        var started = Date.now();
        var done = false;

        function hide() {
            if (done) return;          
            done = true;
            var wait = Math.max(0, MIN_MS - (Date.now() - started));
            setTimeout(function () {
                screen.classList.add("hidden");
                setTimeout(function () { screen.remove(); }, 400);
            }, wait);
        }

        if (document.readyState === "complete") hide();
        else window.addEventListener("load", hide);
        setTimeout(hide, MAX_MS);      
    })();
</script>
