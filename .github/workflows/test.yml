name: Run Tests

on: [push]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
            - name: Install dependencies
              run: pip install -r requirements.txt
            - name: Run tests
              env:
                SEPARAKA_SEED_DEFAULTS: "1"
                DEFAULT_USER_PASSWORD: "ci-only-pass-123"
              run: pytest test_taxi_app.py test_join_lock.py test_default_users.py -v
              


