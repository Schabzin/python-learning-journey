<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Which branch is near me?</title>
</head>
<body>
    <h1>Isinkwa Sethu (sample)</h1>
    <button id="locate">Use my location</button>
    <p id="note"></p>
    <ul id="list"></ul>

    <script src="hours.js"></script>
    <script src="branches.js"></script>
    <script>
        validateBranches(BRANCHES);

        function show(rows) {
            const list = document.getElementById("list");
            list.innerHTML = "";
            const now = new Date();
            for (const row of rows) {
                const li = document.createElement("li");
                const distance = row.km === null ? "" : " (" + row.km.toFixed(1) + " km)";
                li.textContent = row.branch.name + distance + ": " + branchStatus(row.branch, now);
                list.appendChild(li);
            }
        }

        const note = document.getElementById("note");
        show(BRANCHES.map((b) => ({ branch: b, km: null })));
        note.textContent = "Tap the button to see which branch is nearest.";

        document.getElementById("locate").addEventListener("click", () => {
            if (!navigator.geolocation) {
                note.textContent = "Your phone can't share location. Both branches are listed below.";
                return;
            }
            note.textContent = "Finding you...";
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const sorted = branchesByDistance(BRANCHES, pos.coords.latitude, pos.coords.longitude);
                    note.textContent = "Nearest: " + sorted[0].branch.name + " (straight-line distance)";
                    show(sorted);
                },
                () => {
                    note.textContent = "Location not shared. That's fine - both branches are listed below.";
                }
            );
        });
    </script>
</body>
</html>
